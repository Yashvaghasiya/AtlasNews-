name: Update news
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate existing data without API requests'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch or validate news
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          if [ "$VALIDATE_ONLY" = "true" ]; then
            python scripts/update-news.py --validate-only
          else
            python scripts/update-news.py
          fi
      - name: Commit refreshed news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GDELT news data"
            git pull --rebase
            git push
          fi
      - name: Request branch-based Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
